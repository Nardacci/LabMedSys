<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LabMedSys · Ativação de conta">
  <title>LabMedSys · Ativar conta</title>
  <link rel="stylesheet" href="./style.css?v=1.6.0">
  <style>
    .invite-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f7fb}.invite-card{width:min(460px,100%);background:#fff;border:1px solid #e7e9ef;border-radius:16px;padding:32px;box-shadow:0 12px 36px rgba(25,30,45,.08)}.invite-brand{font-size:24px;font-weight:800;margin-bottom:28px}.invite-brand span{font-weight:500}.invite-heading h1{margin:0 0 8px;font-size:25px}.invite-heading p{margin:0 0 24px;color:#687083}.invite-form{display:grid;gap:16px}.invite-form label{display:grid;gap:7px;font-size:13px;font-weight:600;color:#343a48}.invite-form input{height:40px;border:1px solid #dfe2e8;border-radius:8px;padding:0 12px;font:inherit;outline:none}.invite-form input:focus{border-color:#7b61d9;box-shadow:0 0 0 3px rgba(123,97,217,.10)}.invite-message{min-height:20px;font-size:13px;color:#687083}.invite-message.error{color:#b42318}.invite-message.success{color:#147a4b}.invite-primary{height:40px;border:0;border-radius:8px;background:#7656d6;color:#fff;font-weight:700;cursor:pointer}.invite-primary:disabled{opacity:.6;cursor:default}.invite-footer{margin:24px 0 0;text-align:center;font-size:12px;color:#9298a6}
  </style>
</head>
<body>
  <div class="invite-page">
    <main class="invite-card">
      <div class="invite-brand">Lab<span>Med</span>Sys</div>
      <div class="invite-heading">
        <h1>Ative sua conta</h1>
        <p>Defina sua senha para concluir o acesso ao Workspace.</p>
      </div>
      <form id="activate-form" class="invite-form" novalidate>
        <label><span>Nova senha</span><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Mínimo de 8 caracteres"></label>
        <label><span>Confirmar senha</span><input id="password-confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Digite novamente"></label>
        <div id="activate-message" class="invite-message"></div>
        <button id="activate-btn" class="invite-primary" type="submit">Ativar conta</button>
      </form>
      <p class="invite-footer">LabMedSys · SaaS Foundation · v1.18.0</p>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./auth-service.js?v=1.3.0"></script>
  <script src="./signup-complete.js?v=1.4.0"></script>
</body>
</html>
