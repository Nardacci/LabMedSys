<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LabMedSys · Conta de Usuário</title><link rel="stylesheet" href="./style.css?v=1.6.0"><link rel="stylesheet" href="./governance-support.css?v=1.6.1"></head><body><div class="workspace-home"><header class="workspace-header"><a class="workspace-brand" href="workspace.html" aria-label="Ir para a Home do Workspace"><div class="sidebar-mark">L</div><strong>Lab<span>Med</span>Sys</strong></a><div class="governance-page-context"><strong id="page-context-title">Nova conta de usuário</strong><span>Vincule uma conta a um Profissional e configure o acesso.</span></div><div class="workspace-header-actions"><button class="header-icon" aria-label="Notificações">◦</button><div class="user-menu-wrap"><button class="user-chip" id="user-menu" aria-expanded="false" aria-haspopup="true"><span class="user-avatar">A</span><span><strong id="workspace-user-name">Administrador</strong><small>Proprietário do Workspace</small></span><b>⌄</b></button><div class="user-dropdown" id="user-dropdown" hidden><div class="user-dropdown-profile"><span class="user-avatar">A</span><div><strong id="dropdown-user-name">Administrador</strong><small id="dropdown-user-email"></small></div></div><div class="user-dropdown-divider"></div><a class="dropdown-item" href="workspace-setup.html?revisit=1"><span>⚙</span> Configuração do Workspace</a><a class="dropdown-item workspace-admin-link" href="workspace-admin.html"><span>🛠</span> Administração do Workspace</a><button class="dropdown-item danger" id="sign-out-btn"><span>↪</span> Sair</button></div></div></div></header><main class="governance-form-page"><a class="governance-back-link" href="users-access.html"><span class="back-arrow">←</span> Contas de Usuário</a><section class="governance-form-card"><form id="user-account-form" novalidate><div class="governance-form-inner"><h2 class="governance-form-section-title">PROFISSIONAL</h2><div class="governance-form-grid"><label class="full" style="margin-top:0;padding-top:0;border-top:0"><span>Buscar Profissional <b>*</b></span><div class="professional-picker"><input id="professional-search" type="search" placeholder="Digite nome ou código do profissional..." autocomplete="off"><div id="professional-results" class="professional-results" hidden></div></div><input id="professional-id" type="hidden"></label><label><span>Profissional selecionado</span><input id="full-name" type="text" readonly placeholder="Nenhum profissional selecionado"></label><label><span>Código</span><input id="professional-code" type="text" readonly placeholder="—"></label></div><h2 class="governance-form-section-title" style="padding-top:14px;border-top:1px solid #f0f2f5;margin-top:15px">ACESSO</h2><div class="governance-form-grid"><label><span>E-mail de acesso <b>*</b></span><input id="email" type="email" autocomplete="email" placeholder="usuario@empresa.com" required></label><label><span>Papel do Workspace <b>*</b></span><select id="role"><option value="member">Membro</option><option value="admin">Administrador</option><option value="viewer">Visualizador</option></select></label><label id="status-field" hidden><span>Status <b>*</b></span><select id="status"><option value="active">Ativo</option><option value="inactive">Inativo</option><option value="invited">Convite</option></select></label></div><div id="governance-form-message" class="governance-form-message"></div><div class="governance-form-actions"><a class="governance-secondary" href="users-access.html">Cancelar</a><button class="governance-primary" id="save-btn" type="submit">Enviar convite</button></div></div></form></section></main><footer class="workspace-footer">LabMedSys · SaaS Foundation · v1.17.0</footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-service.js?v=1.3.0"></script><script src="./user-account-form.js?v=1.2.0"></script></body></html>
