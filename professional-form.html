<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LabMedSys · Profissional</title>
<link rel="stylesheet" href="./style.css?v=1.6.0"><link rel="stylesheet" href="./professionals.css?v=1.2.0">
</head>
<body><div class="professionals-page">
<header class="workspace-header"><a class="workspace-brand" href="workspace.html"><div class="sidebar-mark">L</div><strong>Lab<span>Med</span>Sys</strong></a><div class="professional-page-context"><strong>Profissionais</strong><span>Cadastro e manutenção dos profissionais que atuam na organização.</span></div><div class="workspace-header-actions"><button class="header-icon" aria-label="Notificações">◦</button><div class="user-menu-wrap"><button class="user-chip" id="user-menu" aria-expanded="false" aria-haspopup="true"><span class="user-avatar">A</span><span><strong id="workspace-user-name">Administrador</strong><small>Proprietário do Workspace</small></span><b>⌄</b></button><div class="user-dropdown" id="user-dropdown" hidden><div class="user-dropdown-profile"><span class="user-avatar">A</span><div><strong id="dropdown-user-name">Administrador</strong><small id="dropdown-user-email"></small></div></div><div class="user-dropdown-divider"></div><a class="dropdown-item" href="workspace.html"><span>⌂</span> Workspace Home</a><button class="dropdown-item danger" id="sign-out-btn"><span>↪</span> Sair</button></div></div></div></header>
<main class="professional-form-page"><a class="governance-back-link" href="governance.html"><span class="back-arrow">←</span> Central de Governança</a>
<section class="professional-form-card"><form id="professional-form"><div class="professional-form-inner"><div class="professional-section-title">Identificação</div><div class="professional-grid two"><label class="professional-field"><span>Código <b>*</b></span><input id="field-code" maxlength="30" required placeholder="Ex.: PROF-001"></label><label class="professional-field"><span>Nome completo <b>*</b></span><input id="field-name" maxlength="160" required placeholder="Nome do profissional"></label></div>
<div class="professional-section-title">Enquadramento profissional</div><div class="professional-grid two"><label class="professional-field"><span>Ocupação</span><select id="field-occupation"><option value="">Selecione...</option></select></label><label class="professional-field"><span>Função profissional</span><select id="field-function"><option value="">Selecione...</option></select></label></div><div class="professional-grid two"><label class="professional-field"><span>Conselho profissional</span><input id="field-council" maxlength="60" placeholder="Ex.: CRF, CRQ, CREA"></label><label class="professional-field"><span>Número de registro</span><input id="field-registration" maxlength="60" placeholder="Número do registro"></label></div>
<div class="professional-section-title">Contato</div><div class="professional-grid two"><label class="professional-field"><span>E-mail</span><input id="field-email" type="email" maxlength="160" placeholder="profissional@empresa.com"></label><label class="professional-field"><span>Telefone</span><input id="field-phone" maxlength="40" placeholder="(00) 00000-0000"></label></div>
<div id="professional-form-message" class="professional-form-message"></div><div class="professional-form-actions"><a class="professional-secondary" href="professionals.html">Cancelar</a><button class="professionals-primary" id="save-btn" type="submit">Salvar</button></div></div></form></section></main>
<footer class="workspace-footer">LabMedSys · SaaS Foundation · v1.14.0</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-service.js?v=1.3.0"></script><script src="./professional-form.js?v=1.0.0"></script></body></html>
